name: Quant bias check

# Phase 2 / D4: downloads PUBLIC market data (no credentials) and runs Freqtrade's
# lookahead-analysis and recursive-analysis on the project strategies. Never trades.
#
# Triggers: manual dispatch (needs this file on the default branch) or a push to a claude/**
# branch whose head commit message contains "[bias-check]".

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: "Exchange for public candle data"
        default: "binance"
      pairs:
        description: "Space-separated pairs"
        default: "BTC/USDT ETH/USDT SOL/USDT"
      timerange:
        description: "Analysis time range (YYYYMMDD-YYYYMMDD)"
        default: "20230101-20240101"
  push:
    branches: ["claude/**"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXCHANGE: ${{ inputs.exchange || 'binance' }}
  PAIRS: ${{ inputs.pairs || 'BTC/USDT ETH/USDT SOL/USDT' }}
  TIMERANGE: ${{ inputs.timerange || '20230101-20240101' }}
  DOWNLOAD_RANGE: "20220601-"
  STRATEGIES: "TrendEmaCross MeanReversionRsiBb BreakoutDonchian MomentumRoc"

jobs:
  bias-check:
    name: "lookahead + recursive analysis"
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bias-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
          enable-cache: false
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv pip install -r quant/requirements.txt
          uv pip install -e .
          freqtrade create-userdir --userdir user_data

      - name: Download public candles (no credentials)
        shell: bash
        env:
          FREQTRADE__EXCHANGE__NAME: ${{ env.EXCHANGE }}
        run: |
          read -ra PAIR_ARR <<< "$PAIRS"
          freqtrade download-data -c quant/configs/base.json --userdir user_data \
            -p "${PAIR_ARR[@]}" -t 1h --timerange "$DOWNLOAD_RANGE"
          data_hash=$(find user_data/data -type f -name '*.feather' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          {
            echo "### Data"
            echo "- exchange: \`$EXCHANGE\`  pairs: \`$PAIRS\`  download range: \`$DOWNLOAD_RANGE\`"
            echo "- commit: \`$GITHUB_SHA\`  data sha256: \`$data_hash\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: lookahead-analysis
        shell: bash
        env:
          FREQTRADE__EXCHANGE__NAME: ${{ env.EXCHANGE }}
        run: |
          read -ra PAIR_ARR <<< "$PAIRS"
          read -ra STRAT_ARR <<< "$STRATEGIES"
          freqtrade lookahead-analysis -c quant/configs/base.json -c quant/configs/backtest.json \
            --userdir user_data --strategy-path quant/strategies --strategy-list "${STRAT_ARR[@]}" \
            --timerange "$TIMERANGE" -i 1h -p "${PAIR_ARR[@]}" \
            --minimum-trade-amount 10 --targeted-trade-amount 20 \
            --lookahead-analysis-exportfilename user_data/lookahead.csv 2>&1 | tee user_data/lookahead.log

      - name: Evaluate lookahead result (fail on bias or missing strategy)
        shell: bash
        run: |
          python - <<'PY'
          import csv, os, sys
          expected = os.environ["STRATEGIES"].split()
          rows = {r["strategy"]: r for r in csv.DictReader(open("user_data/lookahead.csv"))}
          lines = ["### lookahead-analysis"]
          failed = False
          for name in expected:
              row = rows.get(name)
              if row is None:
                  status, failed = "NOT EVALUATED (too few trades or analysis failed)", True
              elif row["has_bias"].strip().lower() == "true":
                  status, failed = f"BIAS (entries={row['biased_entry_signals']}, exits={row['biased_exit_signals']}, indicators={row['biased_indicators']})", True
              else:
                  status = "no bias detected"
              lines.append(f"- {name}: {status}")
          print("\n".join(lines))
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          sys.exit(1 if failed else 0)
          PY

      - name: recursive-analysis (archived for review)
        shell: bash
        env:
          FREQTRADE__EXCHANGE__NAME: ${{ env.EXCHANGE }}
        run: |
          read -ra PAIR_ARR <<< "$PAIRS"
          for strategy in $STRATEGIES; do
            echo "=== $strategy"
            freqtrade recursive-analysis -c quant/configs/base.json -c quant/configs/backtest.json \
              --userdir user_data --strategy-path quant/strategies --strategy "$strategy" \
              --timerange "$TIMERANGE" -i 1h -p "${PAIR_ARR[0]}" \
              --startup-candle 199 399 599 999 2>&1 | tee -a user_data/recursive.log
          done
          {
            echo "### recursive-analysis"
            echo "Variance table archived in artifact. Acceptance: variance in the '(from strategy)' column <= 0.1% for every indicator."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bias-check-${{ github.sha }}
          path: |
            user_data/lookahead.csv
            user_data/lookahead.log
            user_data/recursive.log
          if-no-files-found: warn
          retention-days: 30
