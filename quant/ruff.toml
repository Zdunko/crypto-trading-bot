# Inherit upstream Freqtrade lint rules; only add project-local adjustments.
extend = "../pyproject.toml"

[lint.isort]
known-first-party = ["quantlab"]

[lint.per-file-ignores]
"docs/phase4c/s1_scripts/*.py" = ["ALL"]  # one-off audit scripts, documented, not project code
"docs/phase4c/s3_scripts/*.py" = ["ALL"]  # audit scripts (scratch fetch + analysis), documented, not project code
"docs/phase4c/s4_scripts/*.py" = ["ALL"]  # one-off generator, documented
"docs/phase4c/s5_scripts/*.py" = ["ALL"]  # one-off investigation scripts, documented
"tests/*" = ["S101", "E501", "RUF059", "C408"]  # E501: fixtures are verbatim log lines
"tests/test_pit_universe.py" = ["S311", "SIM115"]  # seeded synthetic markets, gzip reads in tests
"quantlab/report.py" = ["E501"]  # markdown table rows
"quantlab/report4.py" = ["E501", "ISC004"]  # markdown table rows
"quantlab/phase3.py" = ["E501"]
"quantlab/phase4.py" = ["E501"]
"reports/family_a/build_report.py" = ["E501", "S101", "PLR0914", "PLR0915", "C901", "PLR0912", "PLC0415", "E402", "PLR0124"]  # one-off report generator
"quantlab/risk_v2.py" = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0914", "PLW2901"]  # state machine kept linear for audit
"quantlab/pit_*.py" = ["E501", "C901", "PLR0912", "PLR0914", "PLR0915", "S311", "SIM115", "PLR0913"]  # builder: linear pipeline, seeded sampling for validation
"quantlab/active_stats.py" = ["E501"]
"quantlab/protocol.py" = ["E501"]
"quantlab/charts.py" = ["E501", "E731"]
"quantlab/family_a_eval.py" = ["E501", "C901", "PLR0912", "PLR0915", "PLR0914"]  # one linear evaluation script
"quantlab/family_a.py" = ["E501"]
"quantlab/stats.py" = ["E501"]
"quantlab/causality.py" = ["E501"]
"quantlab/stage0.py" = ["E501"]
"quantlab/execution.py" = ["E501", "C901", "PLR0912", "PLR0915"]  # one explicit event loop, kept linear for audit  # CLI argument lists and progress messages
"strategies_r1/*.py" = ["E501", "C901", "PLR0913", "PLR0911"]  # overlay glue: Freqtrade callback signatures
