# Inherit upstream Freqtrade lint rules; only add project-local adjustments.
extend = "../pyproject.toml"

[lint.isort]
known-first-party = ["quantlab"]

[lint.per-file-ignores]
"tests/*" = ["S101", "E501", "RUF059", "C408"]  # E501: fixtures are verbatim log lines
"quantlab/report.py" = ["E501"]  # markdown table rows
"quantlab/report4.py" = ["E501", "ISC004"]  # markdown table rows
"quantlab/phase3.py" = ["E501"]
"quantlab/phase4.py" = ["E501"]
"quantlab/family_a.py" = ["E501"]
"quantlab/stats.py" = ["E501"]
"quantlab/causality.py" = ["E501"]
"quantlab/stage0.py" = ["E501"]
"quantlab/execution.py" = ["E501", "C901", "PLR0912", "PLR0915"]  # one explicit event loop, kept linear for audit  # CLI argument lists and progress messages
"strategies_r1/*.py" = ["E501", "C901", "PLR0913", "PLR0911"]  # overlay glue: Freqtrade callback signatures
