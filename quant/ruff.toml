# Inherit upstream Freqtrade lint rules; only add project-local adjustments.
extend = "../pyproject.toml"

[lint.isort]
known-first-party = ["quantlab"]

[lint.flake8-bugbear]
# B008 (call in a default argument) fires in newer ruff for `cfg: FamilyAConfig = FamilyAConfig()` in the frozen
# quantlab/family_a.py. FamilyAConfig is `@dataclass(frozen=True)`, so the shared default instance is immutable and
# the rule's concern does not apply. Declaring only this class immutable keeps B008 fully active for every other call
# and every other file (a per-file ignore would have disabled it for the whole module).
extend-immutable-calls = ["quant.quantlab.family_a.FamilyAConfig"]

[lint.per-file-ignores]
"docs/phase4c/s1_scripts/*.py" = ["ALL"]  # one-off audit scripts, documented, not project code
